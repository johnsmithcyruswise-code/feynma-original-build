    <!-- Security & Anti-Inspection Hardening + PWA Service Worker -->
    <script>
      // 1. Block right-click context menu
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        return false;
      });

      // 2. Block developer inspection shortcuts (F12, Ctrl+Shift+I/J/C, Ctrl+U, Cmd+Option+I)
      document.addEventListener('keydown', function(e) {
        if (e.key === 'F12') {
          e.preventDefault();
          return false;
        }
        if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) {
          e.preventDefault();
          return false;
        }
        if (e.metaKey && e.altKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j')) {
          e.preventDefault();
          return false;
        }
        if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) {
          e.preventDefault();
          return false;
        }
      });

      // 3. Register PWA Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function(err) {
            console.log('[PWA] Service worker registration note:', err);
          });
        });
      }
    </script>
  </body>
