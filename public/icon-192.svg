<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0B0F19" />
    </radialGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6366F1" flood-opacity="0.4" />
    </filter>
  </defs>
  <rect width="192" height="192" rx="42" fill="url(#bg)" />
  <rect x="2" y="2" width="188" height="188" rx="40" fill="none" stroke="rgba(99,102,241,0.25)" stroke-width="2" />
  <!-- Waveform / Orbit Motif -->
  <g filter="url(#shadow)">
    <circle cx="96" cy="96" r="54" fill="none" stroke="rgba(99,102,241,0.3)" stroke-width="3" stroke-dasharray="6 6" />
    <path d="M 52 96 Q 74 60, 96 96 T 140 96" fill="none" stroke="url(#glow)" stroke-width="6" stroke-linecap="round" />
    <circle cx="96" cy="96" r="16" fill="#6366F1" />
    <circle cx="96" cy="96" r="7" fill="#10B981" />
  </g>
</svg>
